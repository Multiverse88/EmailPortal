services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      - PORT=4000
      - NODE_ENV=production
      - DATABASE_URL=file:/app/data/prod.db
      - STORAGE_DIR=/app/storage
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-easy-legal-portal-secret-key-2026}
      - JWT_SECRET=${JWT_SECRET:-easy-legal-jwt-secret-dokploy-2026}
      - HOSTINGER_DOMAIN=${HOSTINGER_DOMAIN:-clienteasylegal.co.id}
      - CORS_ORIGIN=*
      - AUTO_SEED_DEMO=${AUTO_SEED_DEMO:-false}
      - STORAGE_DRIVER=${STORAGE_DRIVER:-local}
      - HOSTINGER_API_TOKEN=${HOSTINGER_API_TOKEN:-}
      - HOSTINGER_ORDER_ID=${HOSTINGER_ORDER_ID:-}
      - HOSTINGER_SMTP_HOST=${HOSTINGER_SMTP_HOST:-smtp.hostinger.com}
      - HOSTINGER_SMTP_PORT=${HOSTINGER_SMTP_PORT:-465}
      - HOSTINGER_SMTP_USER=${HOSTINGER_SMTP_USER:-admin@clienteasylegal.co.id}
      - HOSTINGER_SMTP_PASS=${HOSTINGER_SMTP_PASS:-}
      - HOSTINGER_IMAP_HOST=${HOSTINGER_IMAP_HOST:-imap.hostinger.com}
      - HOSTINGER_IMAP_PORT=${HOSTINGER_IMAP_PORT:-993}
      - SYNC_INTERVAL_MS=${SYNC_INTERVAL_MS:-15000}
      - S3_ENDPOINT=${S3_ENDPOINT:-}
      - S3_BUCKET=${S3_BUCKET:-}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-}
      - S3_REGION=${S3_REGION:-}
      - NINEROUTER_API_KEY=${NINEROUTER_API_KEY:-}
      - NINEROUTER_BASE_URL=${NINEROUTER_BASE_URL:-}
      - NINEROUTER_MODEL=${NINEROUTER_MODEL:-}
      - SYNOLOGY_RUNNER_TOKEN=${SYNOLOGY_RUNNER_TOKEN:-easylegal-synology-runner-secret-2026}
    volumes:
      - easylegal_backend_data:/app/data
      - easylegal_backend_storage:/app/storage
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - easylegal_net
      - dokploy-network

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        - BACKEND_INTERNAL_URL=http://backend:4000
    restart: unless-stopped
    environment:
      - PORT=3000
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
      - BACKEND_INTERNAL_URL=http://backend:4000
      - NEXT_PUBLIC_HOSTINGER_DOMAIN=${HOSTINGER_DOMAIN:-clienteasylegal.co.id}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - easylegal_net
      - dokploy-network

volumes:
  easylegal_backend_data:
  easylegal_backend_storage:

networks:
  easylegal_net:
    driver: bridge
  dokploy-network:
    external: true
