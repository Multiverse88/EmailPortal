</div>

<label class="font-body-text text-body-text text-on-surface cursor-pointer select-none" for="personal-msg">Send personalized welcome message</label>
</div>

<div class="hidden flex-col gap-xs mt-xs" id="message-area">

                    </button>
</div>

<script>
        // Simple interaction for the checkbox to show textarea
        document.getElementById('personal-msg').addEventListener('change', function(e) {
            const textArea = document.getElementById('message-area');
            if(e.target.checked) {
                textArea.classList.remove('hidden');
                textArea.classList.add('flex');
            } else {
                textArea.classList.add('hidden');
                textArea.classList.remove('flex');
            }
        });
    </script>
