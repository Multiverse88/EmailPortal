services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: easylegal-backend
    restart: unless-stopped
    environment:
      - PORT=4000
      - NODE_ENV=production
      - DATABASE_URL=file:/app/data/prod.db
      - STORAGE_DIR=/app/storage
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-easy-legal-portal-secret-key-2026}
      - JWT_SECRET=${JWT_SECRET:-easy-legal-jwt-secret-dokploy-2026}
      - HOSTINGER_DOMAIN=${HOSTINGER_DOMAIN:-clienteasylegal.co.id}
      - CORS_ORIGIN=*
      - AUTO_SEED_DEMO=true
      - HOSTINGER_API_TOKEN=${HOSTINGER_API_TOKEN:-}
      - HOSTINGER_SMTP_HOST=${HOSTINGER_SMTP_HOST:-smtp.hostinger.com}
      - HOSTINGER_SMTP_PORT=${HOSTINGER_SMTP_PORT:-465}
      - HOSTINGER_SMTP_USER=${HOSTINGER_SMTP_USER:-admin@clienteasylegal.co.id}
      - HOSTINGER_SMTP_PASS=${HOSTINGER_SMTP_PASS:-}
      - NINEROUTER_API_KEY=${NINEROUTER_API_KEY:-}
    volumes:
      - easylegal_backend_data:/app/data
      - easylegal_backend_storage:/app/storage
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - easylegal_net

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: easylegal-frontend
    restart: unless-stopped
    environment:
      - PORT=3000
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
      - BACKEND_INTERNAL_URL=http://backend:4000
      - NEXT_PUBLIC_HOSTINGER_DOMAIN=${HOSTINGER_DOMAIN:-clienteasylegal.co.id}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"
    networks:
      - easylegal_net

volumes:
  easylegal_backend_data:
  easylegal_backend_storage:

networks:
  easylegal_net:
    driver: bridge
